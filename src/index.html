<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#74c9f5">
    <meta name="description" content="DUSMP is a community-run Minecraft server. Join the Discord, explore the live map, and read the latest announcements.">
    <meta property="og:title" content="DUSMP — Minecraft SMP">
    <meta property="og:description" content="Come build something with us.">
    <meta property="og:type" content="website">
    <title>DUSMP — Minecraft SMP</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="world">
      <div class="sun" aria-hidden="true"></div>
      <div class="cloud cloud-one" aria-hidden="true"></div>
      <div class="cloud cloud-two" aria-hidden="true"></div>
      <div class="cloud cloud-three" aria-hidden="true"></div>
      <section class="hero-card" aria-labelledby="site-title">
        <p class="eyebrow">Discordian Union SMP</p>
        <h1 id="site-title">DUSMP</h1>
        <p class="intro">A small Minecraft world for big ideas.<br>Come build something with us.</p>

        <dl class="server-info" aria-label="Server details">
          <div class="server-detail">
            <dt>Server IP</dt>
            <dd>dusmp.datho.st</dd>
          </div>
          <div class="server-detail">
            <dt>Version</dt>
            <dd>26.2</dd>
          </div>
        </dl>

        <nav class="link-grid" aria-label="DUSMP links">
          <a class="pixel-button discord" href="https://discord.gg/MRQQfkpXT3"><span aria-hidden="true">◆</span>Discord</a>
          <a class="pixel-button map" href="http://170.23.51.227:17863/"><span aria-hidden="true">▦</span>Live map</a>
          <a class="pixel-button news" href="./announcements/"><span aria-hidden="true">✦</span>Announcements</a>
        </nav>

        <p class="footnote">community-run · block by block</p>
      </section>

      <div class="bee" aria-hidden="true"><span></span></div>
      <div class="tree tree-left" aria-hidden="true">
        <i class="leaves leaves-top"></i><i class="leaves leaves-mid"></i><i class="trunk"></i>
      </div>
      <div class="tree tree-right" aria-hidden="true">
        <i class="leaves leaves-top"></i><i class="leaves leaves-mid"></i><i class="trunk"></i>
      </div>
      <div class="ground" aria-hidden="true">
        <div class="dirt dirt-one"></div><div class="dirt dirt-two"></div><div class="dirt dirt-three"></div>
        <div class="stone stone-one"></div><div class="stone stone-two"></div>
      </div>
    </main>
  </body>
</html>
